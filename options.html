<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>T3 Approval Allowlist</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 20px; color: #202124; }
    textarea { width: 100%; min-height: 180px; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 10px; }
    select, button { margin-top: 10px; padding: 8px 14px; }
    li { margin: 10px 0; }
    .note { color: #5f6368; }
    .status { margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <h1>T3 Approval Allowlist</h1>
  <p class="note">精确模式只保存命令的 SHA-256 指纹。通配符模式保存规范化后的完整规则，`*` 匹配任意字符，`?` 匹配一个字符。</p>
  <select id="mode">
    <option value="exact">精确命令指纹</option>
    <option value="glob">完整命令通配符</option>
  </select>
  <textarea id="command" placeholder="粘贴完整命令或通配符规则"></textarea>
  <br>
  <button id="add">加入白名单</button>
  <div id="status" class="status"></div>
  <h2>已保存规则</h2>
  <ul id="rules"></ul>
  <script src="options.js"></script>
</body>
</html>
